<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itemize | The CRM That Works For You Not Against You</title>
    <meta name="description" content="Itemize is a CRM with contacts, pipelines, scheduling, notes, and automations in one workspace - built to work for you, not against you." />
    <link rel="canonical" href="https://itemize.cloud/home" />
    <link rel="icon" type="image/png" href="/icon.png" sizes="32x32" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Itemize | The CRM That Works For You Not Against You" />
    <meta property="og:description" content="Itemize is a CRM with contacts, pipelines, scheduling, notes, and automations in one workspace." />
    <meta property="og:url" content="https://itemize.cloud/" />
    <meta property="og:image" content="https://itemize.cloud/screenshots/dashboard.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Itemize | The CRM That Works For You Not Against You" />
    <meta name="twitter:description" content="Itemize is a CRM with contacts, pipelines, scheduling, notes, and automations in one workspace." />
    <!-- Gleam/MixFade/FlashCore: fonts off LCP path -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=optional"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=optional"
        rel="stylesheet"
      />
    </noscript>
    <!-- No hero/screenshot preloads: mobile LCP is system-ui H1. -->
    <style>
      html,body{margin:0;background:hsl(220 13% 95%);color:hsl(222.2 84% 4.9%);color-scheme:light}
      html.dark,html.dark body{background:hsl(215 28% 21%);color:hsl(210 20% 98%);color-scheme:dark}
      #lh-lcp-h1{
        font-family:system-ui,-apple-system,Segoe UI,sans-serif!important;
        font-size:clamp(2.15rem,7.5vw,3.4rem);
        font-weight:700;
        line-height:1.1;
        letter-spacing:-0.02em;
        color:hsl(222.2 84% 4.9%);
        margin:0 auto 1.5rem;
        max-width:40rem;
        text-align:center;
      }
      html.dark #lh-lcp-h1{color:hsl(210 20% 98%)}
      #lh-lcp-h1 .lh-accent{color:#2563eb}
      html.dark #lh-lcp-h1 .lh-accent{color:#60a5fa}
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
          var root = document.documentElement;
          if (theme === 'dark') root.classList.add('dark');
          else root.classList.remove('dark');
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
